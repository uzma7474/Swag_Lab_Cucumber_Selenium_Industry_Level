
# Application
application.url=https://www.saucedemo.com/

# ============================================================
# COMMON FRAMEWORK CONFIGURATION
# ============================================================

# ------------------------------------------------------------
# Environment
# ------------------------------------------------------------

# Available environments:
# qa
# prod

environment=qa


# ------------------------------------------------------------
# Browser Configuration
# ------------------------------------------------------------

# Supported browsers:
# chrome
# firefox
# edge

browser=chrome

# Run browser in headless mode
# true / false

headless=false


# ------------------------------------------------------------
# WebDriver Configuration
# ------------------------------------------------------------

# Implicit wait in seconds
implicit.wait=0

# Explicit wait in seconds
explicit.wait=15

# Page load timeout in seconds
page.load.timeout=30

# Script timeout in seconds
script.timeout=30


# ------------------------------------------------------------
# Browser Window
# ------------------------------------------------------------

# Maximize browser window
# true / false

maximize=true


# ------------------------------------------------------------
# Screenshot Configuration
# ------------------------------------------------------------

# Take screenshot when test fails
# true / false

screenshot.on.failure=true

# Take screenshot after every step
# true / false

screenshot.after.step=false


# ------------------------------------------------------------
# Reporting
# ------------------------------------------------------------

# Enable Cucumber HTML report
cucumber.report=true

# Enable Extent report
extent.report=true


# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------

# Log level:
# TRACE
# DEBUG
# INFO
# WARN
# ERROR

log.level=INFO


